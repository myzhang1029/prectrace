[package]
name = "prectrace"
version = "0.2.0"
edition = "2024"
description = "Traceroute with augmented information from the application layer"
readme = true
repository = "https://github.com/myzhang1029/prectrace"
license = "Apache-2.0"
keywords = ["traceroute", "network", "icmp", "sntp", "ntp", "dns"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "prectrace"
path = "prectrace/main.rs"

[lib]
name = "prectrace_lib"
path = "prectrace_lib/lib.rs"

[dependencies]
anyhow = "1"
bytes = { version = "^1, >=1.11.1", default-features = false }
clap = { version = "4", features = ["cargo", "derive", "string"] }
chrono = "0.4"
hickory-proto = { version = "0.26", features = ["serde"] }
libc = "0.2"
ntp_usg-proto = "5"
rand = "0.10"
serde = "1"
serde_json = "1"
socket2 = "0.6"
thiserror = "2"
tokio = { version = "^1, >=1.23.1", features = ["full"] }
tracing = { version = "0.1", features = ["attributes"], default-features = false }
tracing-subscriber = { version = "^0.3, >=0.3.20", features = ["fmt", "env-filter"] }
zerocopy = "0.8"
zerocopy-derive = "0.8"
